<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar Evoluzione v2</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head><body><main><small>METEO CONTE · PROTOTIPO V2</small><h1>Evoluzione animata</h1><div class="tabs"><button id="live">LIVE</button><button id="demo" class="on">DEMO PERTURBAZIONE</button></div><section><header><b id="badge">DEMO</b><strong id="time">--:--</strong><span id="src">evento sintetico</span></header><div id="map"></div><div class="labels"><span>PASSATO</span><b>● ADESSO</b><span>FUTURO</span></div><input id="range" type="range" min="0" max="20" value="8"><div class="labels"><span>-2h</span><span>adesso</span><span>+3h</span></div><div class="ctrl"><button id="prev">◀</button><button id="play">▶ Play</button><button id="next">▶</button><button id="now">Adesso</button></div></section><p id="status">DEMO: evento simulato, non è una previsione reale. Premi Play.</p></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
